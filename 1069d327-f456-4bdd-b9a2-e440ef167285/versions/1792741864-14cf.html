<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Метро-бегун</title>
<style>
:root{--bg:#1b1330;--ink:#fff6e0;--accent:#ffb400;--panel:rgba(27,19,48,.82);color-scheme:light dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1330;--ink:#fff6e0;--accent:#ffb400;--panel:rgba(27,19,48,.82)}}
:root[data-theme="dark"]{--bg:#1b1330;--ink:#fff6e0;--accent:#ffb400;--panel:rgba(27,19,48,.82)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden;touch-action:none;user-select:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#wrap{position:relative;height:100%;max-width:480px;margin:0 auto}
canvas{width:100%;height:100%;display:block}
#hud{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;padding:0 14px;font-weight:700;font-size:20px;pointer-events:none;text-shadow:0 2px 0 #0006}
#menu{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--panel);text-align:center;padding:24px}
#menu h1{font-size:44px;margin:0;color:var(--accent);letter-spacing:1px}
#menu p{margin:0;max-width:300px;line-height:1.4}
button{font:inherit;font-weight:800;font-size:22px;padding:14px 38px;border:0;border-radius:14px;background:var(--accent);color:#2a1a00;cursor:pointer;box-shadow:0 5px 0 #b37d00}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b37d00}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c"></canvas>
<div id="hud"><span id="sc">0 м</span><span id="co">🪙 0</span><span id="hi">Рекорд 0</span></div>
<div id="menu">
<h1 id="title">Метро-бегун</h1>
<p id="msg">Беги по рельсам, уворачивайся от поездов и собирай монеты.<br>← → меняют дорожку, ↑ прыжок, ↓ кувырок.<br>На телефоне — свайпы.</p>
<button id="go">Играть</button>
</div>
</div>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W,H,dpr;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);resize();

var hi=0;try{hi=+localStorage.getItem('mr_hi')||0}catch(e){}
document.getElementById('hi').textContent='Рекорд '+hi;

var HZ=0.32,Z_MAX=60; // горизонт и дальность
var lane,laneX,y,vy,roll,state,speed,dist,coins,obs,items,t,dead;
var G=-60;
function reset(){lane=1;laneX=1;y=0;vy=0;roll=0;speed=14;dist=0;coins=0;obs=[];items=[];t=0;dead=false;nextZ=20}
var nextZ=20;

function proj(l,z,h){ // lane -1..1 (x), z depth, h height
  var k=1/(1+z*0.075);
  var horizonY=H*HZ, groundY=H*0.88;
  var sy=horizonY+(groundY-horizonY)*k;
  var sx=W/2+l*W*0.27*k;
  return {x:sx,y:sy-h*k*H*0.08,k:k};
}

function spawn(){
  while(nextZ<dist+Z_MAX){
    var r=Math.random(),ln=Math.floor(Math.random()*3);
    if(r<0.45){ // поезд
      var len=6+Math.random()*6;
      obs.push({t:'train',lane:ln,z:nextZ,len:len,col:['#e4572e','#2e86ab','#76b041'][Math.floor(Math.random()*3)]});
      if(Math.random()<.5)for(var i=0;i<4;i++)items.push({lane:(ln+1+Math.floor(Math.random()*2))%3,z:nextZ+i*2,got:false});
    }else if(r<0.7){obs.push({t:'low',lane:ln,z:nextZ,len:1}); // барьер — прыгать
      items.push({lane:ln,z:nextZ,got:false,h:2.2});
    }else if(r<0.85){obs.push({t:'high',lane:ln,z:nextZ,len:1}); // перекладина — кувырок
    }else{for(var j=0;j<6;j++)items.push({lane:ln,z:nextZ+j*1.6,got:false})}
    nextZ+=8+Math.random()*7;
  }
}

function box(l,z,len,w,h,col,top){
  var a=proj(l-w,z,0),b=proj(l+w,z,0),c=proj(l-w,z,h),d=proj(l+w,z,h);
  var a2=proj(l-w,z+len,0),b2=proj(l+w,z+len,0),c2=proj(l-w,z+len,h),d2=proj(l+w,z+len,h);
  // верх
  ctx.fillStyle=top||col;ctx.beginPath();ctx.moveTo(c.x,c.y);ctx.lineTo(d.x,d.y);ctx.lineTo(d2.x,d2.y);ctx.lineTo(c2.x,c2.y);ctx.fill();
  // перед
  ctx.fillStyle=col;ctx.fillRect(c.x,c.y,d.x-c.x,a.y-c.y);
  ctx.fillStyle='#0003';ctx.fillRect(c.x,c.y,d.x-c.x,a.y-c.y);
  ctx.fillStyle=col;ctx.fillRect(c.x+2,c.y+2,d.x-c.x-4,a.y-c.y-4);
  return {c:c,d:d,a:a};
}

function drawBG(){
  var g=ctx.createLinearGradient(0,0,0,H*HZ+40);g.addColorStop(0,'#2b1a54');g.addColorStop(1,'#d9487c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // город
  ctx.fillStyle='#1b1330';
  for(var i=0;i<14;i++){var bw=W/14,bh=20+((i*37)%50);ctx.fillRect(i*bw,H*HZ-bh,bw-3,bh+2)}
  // земля
  ctx.fillStyle='#3a3a4a';ctx.fillRect(0,H*HZ,W,H);
  // дорожки
  for(var l=-1;l<=1;l++){
    var p1=proj(l-.45,0,0),p2=proj(l+.45,0,0),p3=proj(l-.45,Z_MAX,0),p4=proj(l+.45,Z_MAX,0);
    ctx.fillStyle='#4b4b5e';ctx.beginPath();ctx.moveTo(p1.x,p1.y);ctx.lineTo(p2.x,p2.y);ctx.lineTo(p4.x,p4.y);ctx.lineTo(p3.x,p3.y);ctx.fill();
    // шпалы
    ctx.strokeStyle='#2d2d3a';ctx.lineWidth=2;
    var off=dist%3;
    for(var z=-off;z<Z_MAX;z+=3){var q1=proj(l-.45,z,0),q2=proj(l+.45,z,0);ctx.beginPath();ctx.moveTo(q1.x,q1.y);ctx.lineTo(q2.x,q2.y);ctx.stroke()}
    // рельсы
    ctx.strokeStyle='#c9c9d6';ctx.lineWidth=2;
    [-.25,.25].forEach(function(d){var r1=proj(l+d,0,0),r2=proj(l+d,Z_MAX,0);ctx.beginPath();ctx.moveTo(r1.x,r1.y);ctx.lineTo(r2.x,r2.y);ctx.stroke()});
  }
}

function drawPlayer(){
  var p=proj((laneX-1),0.5,y),k=p.k;
  var s=H*0.075;
  var h=roll>0?s*.9:s*1.9;
  var bob=Math.sin(t*14)*3*(y===0?1:0);
  ctx.fillStyle='#0004';ctx.beginPath();ctx.ellipse(p.x,proj(laneX-1,0.5,0).y,s*.5,s*.15,0,0,7);ctx.fill();
  var bx=p.x,by=p.y+bob;
  // тело
  ctx.fillStyle='#ffb400';ctx.fillRect(bx-s*.4,by-h,s*.8,h*.62);
  ctx.fillStyle='#2e86ab';ctx.fillRect(bx-s*.4,by-h*.38,s*.8,h*.38); // штаны
  // голова
  ctx.fillStyle='#f2c196';ctx.beginPath();ctx.arc(bx,by-h-s*.18,s*.3,0,7);ctx.fill();
  ctx.fillStyle='#e4572e';ctx.fillRect(bx-s*.34,by-h-s*.46,s*.68,s*.18); // кепка
  ctx.fillRect(bx,by-h-s*.34,s*.5,s*.1);
  // ноги
  if(roll===0&&y===0){var sw=Math.sin(t*14)*s*.2;ctx.fillStyle='#fff';ctx.fillRect(bx-s*.3+sw,by-3,s*.25,6);ctx.fillRect(bx+s*.05-sw,by-3,s*.25,6)}
}

function drawWorld(){
  var list=[];
  obs.forEach(function(o){list.push({z:o.z+o.len,o:o,k:'o'})});
  items.forEach(function(i){if(!i.got)list.push({z:i.z,o:i,k:'i'})});
  list.sort(function(a,b){return b.z-a.z});
  var drewP=false;
  list.forEach(function(e){
    var rz=e.z-dist;
    if(!drewP&&rz<0.5){drawPlayer();drewP=true}
    if(e.k==='i'){
      var i=e.o,z=i.z-dist;if(z<0.2||z>Z_MAX)return;
      var p=proj(i.lane-1,z,i.h||1.2),r=H*.022*p.k*2.2;
      ctx.fillStyle='#ffd23f';ctx.strokeStyle='#b37d00';ctx.lineWidth=2;
      var w=r*Math.abs(Math.cos(t*5+i.z));
      ctx.beginPath();ctx.ellipse(p.x,p.y,Math.max(w,2),r,0,0,7);ctx.fill();ctx.stroke();
    }else{
      var o=e.o,z=o.z-dist;if(z+o.len<0.1||z>Z_MAX)return;
      var zz=Math.max(z,0.05),ln=o.len-(zz-z);
      var l=o.lane-1;
      if(o.t==='train'){
        box(l,zz,ln,.42,o.col,4.2,'#e8e8f0');
        box(l,zz,ln,.42,4.2,o.col,'#e8e8f0');
        var f=proj(l,zz,3),f2=proj(l-.3,zz,3.2);
        ctx.fillStyle='#fff9';ctx.fillRect(f2.x,f2.y,Math.abs(f.x-f2.x)*2,f.k*H*.04);
      }else if(o.t==='low'){
        box(l,zz,.8,.42,1.3,'#f5f5f5','#c0392b');
        var a=proj(l-.42,zz,1.3),b=proj(l+.42,zz,1.3);ctx.fillStyle='#c0392b';ctx.fillRect(a.x,a.y,b.x-a.x,a.k*H*.015);
      }else{
        // перекладина — низ на высоте 1.8, верх 2.8
        var a=proj(l-.45,zz,2.8),b=proj(l+.45,zz,2.8),a0=proj(l-.45,zz,1.8);
        ctx.fillStyle='#f39c12';ctx.fillRect(a.x,a.y,b.x-a.x,a0.y-a.y);
        ctx.fillStyle='#222';var st=(b.x-a.x)/6;for(var s=0;s<6;s+=2)ctx.fillRect(a.x+s*st,a.y,st,a0.y-a.y);
        ctx.fillStyle='#888';ctx.fillRect(a.x,a0.y,4*a.k+2,proj(l,zz,0).y-a0.y);ctx.fillRect(b.x-4*a.k-2,a0.y,4*a.k+2,proj(l,zz,0).y-a0.y);
      }
    }
  });
  if(!drewP)drawPlayer();
}

function collide(){
  var pz=dist+0.5;
  for(var i=0;i<obs.length;i++){
    var o=obs[i];
    if(o.lane!==lane&&Math.abs(laneX-o.lane)>.55)continue;
    if(Math.abs(laneX-o.lane)>.55)continue;
    if(pz<o.z||pz>o.z+o.len)continue;
    if(o.t==='train'){if(y<4.2-.2)return true}
    else if(o.t==='low'){if(y<1.3)return true}
    else{ if(roll<=0)return true } // перекладина: только кувырок
  }
  return false;
}

var last=0,running=false;
function frame(ts){
  if(!running)return;
  var dt=Math.min((ts-last)/1000,.05);last=ts;t+=dt;
  speed=Math.min(14+dist*0.012,32);
  dist+=speed*dt;
  laneX+=(lane-laneX)*Math.min(1,dt*14);
  if(y>0||vy>0){vy+=G*dt;y+=vy*dt;if(y<=0){y=0;vy=0}}
  if(roll>0)roll-=dt;
  // стоять на поезде
  spawn();
  obs=obs.filter(function(o){return o.z+o.len>dist-3});
  items=items.filter(function(i){return i.z>dist-3&&!i.got});
  items.forEach(function(i){
    if(!i.got&&Math.abs(i.z-(dist+.5))<.8&&Math.abs(laneX-i.lane)<.6&&Math.abs((i.h||1.2)-(y+1.2))<2.2){i.got=true;coins++}
  });
  if(collide()){gameOver();return}
  drawBG();drawWorld();
  document.getElementById('sc').textContent=Math.floor(dist)+' м';
  document.getElementById('co').textContent='🪙 '+coins;
  requestAnimationFrame(frame);
}

function jump(){if(y<=0.01){vy=20;roll=0}}
function dodge(){roll=.6;if(y>0)vy=-30}
function move(d){lane=Math.max(0,Math.min(2,lane+d))}

function gameOver(){
  running=false;
  var sc=Math.floor(dist)+coins*10;
  if(sc>hi){hi=sc;try{localStorage.setItem('mr_hi',hi)}catch(e){}}
  document.getElementById('hi').textContent='Рекорд '+hi;
  document.getElementById('title').textContent='Столкновение!';
  document.getElementById('msg').innerHTML='Дистанция: '+Math.floor(dist)+' м<br>Монеты: '+coins+'<br>Очки: '+sc;
  document.getElementById('go').textContent='Ещё раз';
  document.getElementById('menu').classList.remove('hide');
}
function start(){
  reset();document.getElementById('menu').classList.add('hide');
  running=true;last=performance.now();requestAnimationFrame(frame);
}
document.getElementById('go').addEventListener('click',start);

window.addEventListener('keydown',function(e){
  if(!running)return;
  if(e.key==='ArrowLeft'||e.key==='a')move(-1);
  else if(e.key==='ArrowRight'||e.key==='d')move(1);
  else if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')jump();
  else if(e.key==='ArrowDown'||e.key==='s')dodge();
});
var sx0,sy0;
cv.addEventListener('touchstart',function(e){sx0=e.touches[0].clientX;sy0=e.touches[0].clientY},{passive:true});
cv.addEventListener('touchend',function(e){
  if(!running)return;
  var dx=e.changedTouches[0].clientX-sx0,dy=e.changedTouches[0].clientY-sy0;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<0)jump();else dodge();
},{passive:true});

reset();drawBG();
})();
</script>
</body>
</html>
